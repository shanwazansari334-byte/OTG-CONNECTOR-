name: Build OTG CONNECTOR APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract Android project
        run: |
          mkdir project
          unzip -o "$(find . -maxdepth 1 -name '*.zip' -print -quit)" -d project
          test -f project/settings.gradle.kts

      - name: Build APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: "8.9"
          arguments: assembleDebug
          build-root-directory: project

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: OTG-CONNECTOR-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
